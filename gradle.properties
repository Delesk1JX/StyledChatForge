org.gradle.jvmargs=-Xmx1400M -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.parallel=false
# Disabled on purpose: the Mixin annotation processor writes the refmap as a side effect of
# compileJava, and a cache hit restores the class files without it, producing a jar whose mixins
# cannot be applied. See build.gradle.
org.gradle.caching=false
org.gradle.configuration-cache=false

## Minecraft / Forge
minecraft_version=1.20.1
forge_version=47.4.10
mapping_channel=official
mapping_version=1.20.1

## Build tooling
mixin_gradle_version=0.7.38
# Must match the Mixin version Forge 1.20.1 ships, otherwise the refmap does not apply.
mixin_version=0.8.5

